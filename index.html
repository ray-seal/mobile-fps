<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050505">
  <title>Mobile FPS</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: none;
      user-select: none;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background:
        radial-gradient(circle at center, #252525 0%, #111 45%, #050505 100%);
      overflow: hidden;
    }

    /* Placeholder for the eventual Doom/WASM canvas */
    #game-view {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #game-view::before {
      content: "MOBILE FPS";
      font-size: clamp(28px, 7vw, 70px);
      font-weight: 900;
      letter-spacing: 6px;
      color: #333;
      text-shadow: 3px 3px 0 #000;
    }

    #game-view::after {
      content: "ENGINE LOADING";
      position: absolute;
      margin-top: 100px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #555;
    }

    /* Crosshair */
    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.75);
    }

    #crosshair::before {
      width: 24px;
      height: 2px;
      top: 11px;
      left: 0;
    }

    #crosshair::after {
      width: 2px;
      height: 24px;
      left: 11px;
      top: 0;
    }

    /* Top HUD */
    #top-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: bold;
      font-size: 13px;
      text-shadow: 2px 2px 0 #000;
    }

    #pause {
      pointer-events: auto;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 7px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 18px;
    }

    /* Bottom HUD */
    #bottom-hud {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }

    .stat {
      min-width: 95px;
      padding: 7px 12px;
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
    }

    .stat strong {
      display: block;
      font-size: 20px;
    }

    #weapon {
      min-width: 130px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* Touch controls */
    .control {
      position: absolute;
      z-index: 30;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.42);
      box-shadow: inset 0 0 15px rgba(255,255,255,0.04);
    }

    .control:active,
    .control.active {
      background: rgba(255,255,255,0.2);
      transform: scale(0.94);
    }

    /* Movement joystick */
    #joystick {
      left: 25px;
      bottom: 85px;
      width: 125px;
      height: 125px;
      border-radius: 50%;
    }

    #joystick-knob {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.45);
      transition: transform 0.05s linear;
    }

    /* Fire */
    #fire {
      right: 25px;
      bottom: 90px;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      font-size: 18px;
    }

    /* Use */
    #use {
      right: 125px;
      bottom: 105px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 12px;
    }

    /* Weapon buttons */
    #weapon-up {
      right: 30px;
      bottom: 190px;
      width: 45px;
      height: 45px;
      border-radius: 7px;
      font-size: 20px;
    }

    #weapon-down {
      right: 30px;
      bottom: 240px;
      width: 45px;
      height: 45px;
      border-radius: 7px;
      font-size: 20px;
    }

    /* Pause overlay */
    #pause-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
    }

    #pause-screen.visible {
      display: flex;
    }

    .pause-panel {
      width: min(80%, 400px);
      padding: 30px;
      text-align: center;
      background: #111;
      border: 2px solid #555;
      border-radius: 10px;
    }

    .pause-panel h1 {
      margin-top: 0;
      letter-spacing: 4px;
    }

    .resume {
      margin-top: 20px;
      padding: 14px 30px;
      border: 0;
      border-radius: 6px;
      background: #333;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    /* Smaller phones */
    @media (max-width: 500px) {
      #joystick {
        width: 105px;
        height: 105px;
        left: 15px;
        bottom: 80px;
      }

      #joystick-knob {
        width: 48px;
        height: 48px;
      }

      #fire {
        width: 72px;
        height: 72px;
        right: 15px;
        bottom: 82px;
      }

      #use {
        right: 100px;
        bottom: 95px;
      }
    }
  </style>
</head>

<body>

<div id="game">

  <div id="game-view"></div>

  <div id="crosshair"></div>

  <div id="top-hud">
    <div class="hud-box">MISSION 01</div>
    <button id="pause">Ⅱ</button>
  </div>

  <div id="joystick" class="control">
    <div id="joystick-knob"></div>
  </div>

  <button id="fire" class="control">FIRE</button>
  <button id="use" class="control">USE</button>

  <button id="weapon-up" class="control">▲</button>
  <button id="weapon-down" class="control">▼</button>

  <div id="bottom-hud">
    <div class="stat">
      HEALTH
      <strong id="health">100</strong>
    </div>

    <div class="stat" id="weapon">
      PISTOL
      <strong id="ammo">50</strong>
    </div>

    <div class="stat">
      ARMOUR
      <strong id="armour">0</strong>
    </div>
  </div>

  <div id="pause-screen">
    <div class="pause-panel">
      <h1>PAUSED</h1>
      <p>Mission suspended.</p>
      <button class="resume" id="resume">RESUME</button>
    </div>
  </div>

</div>

<script>
  const fire = document.getElementById("fire");
  const use = document.getElementById("use");
  const pause = document.getElementById("pause");
  const resume = document.getElementById("resume");
  const pauseScreen = document.getElementById("pause-screen");

  let ammo = 50;

  function buttonFeedback(button) {
    button.classList.add("active");

    setTimeout(() => {
      button.classList.remove("active");
    }, 120);
  }

  fire.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    buttonFeedback(fire);

    if (ammo > 0) {
      ammo--;
      document.getElementById("ammo").textContent = ammo;
    }
  });

  use.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    buttonFeedback(use);
  });

  pause.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    pauseScreen.classList.add("visible");
  });

  resume.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    pauseScreen.classList.remove("visible");
  });

  /* Simple joystick */
  const joystick = document.getElementById("joystick");
  const knob = document.getElementById("joystick-knob");

  let joystickActive = false;

  joystick.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    joystickActive = true;
    joystick.setPointerCapture(event.pointerId);
    moveJoystick(event);
  });

  joystick.addEventListener("pointermove", (event) => {
    if (!joystickActive) return;
    moveJoystick(event);
  });

  joystick.addEventListener("pointerup", resetJoystick);
  joystick.addEventListener("pointercancel", resetJoystick);

  function moveJoystick(event) {
    const rect = joystick.getBoundingClientRect();

    const centreX = rect.width / 2;
    const centreY = rect.height / 2;

    let x = event.clientX - rect.left - centreX;
    let y = event.clientY - rect.top - centreY;

    const max = rect.width * 0.28;
    const distance = Math.sqrt(x * x + y * y);

    if (distance > max) {
      x = x / distance * max;
      y = y / distance * max;
    }

    knob.style.transform = `translate(${x}px, ${y}px)`;
  }

  function resetJoystick() {
    joystickActive = false;
    knob.style.transform = "translate(0, 0)";
  }
</script>

</body>
</html>
