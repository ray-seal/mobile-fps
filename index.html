<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mobile FPS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;touch-action:none}
body{position:fixed;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}

#hud{position:absolute;inset:0;z-index:10;pointer-events:none;color:#fff}
#mission{position:absolute;top:14px;left:14px;padding:9px 12px;border:1px solid rgba(255,255,255,.2);border-radius:7px;background:rgba(0,0,0,.45);font-size:12px;font-weight:bold;letter-spacing:.5px}
#objective{position:absolute;top:48px;left:14px;font-size:11px;opacity:.75}
#pause,#mapToggle{
    position:absolute;right:14px;width:50px;height:42px;
    border:1px solid rgba(255,255,255,.3);border-radius:8px;
    background:rgba(0,0,0,.6);color:#fff;font-weight:bold;
    pointer-events:auto;z-index:30
}
#pause{top:14px;font-size:16px}
#mapToggle{top:64px;font-size:11px}
#crosshair{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%)}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.7)}
#crosshair:before{width:12px;height:2px;left:0;top:5px}
#crosshair:after{width:2px;height:12px;left:5px;top:0}

#map{
    position:absolute;right:15px;top:114px;width:min(48vw,280px);height:min(48vw,280px);
    background:rgba(0,0,0,.88);border:2px solid rgba(255,255,255,.35);
    border-radius:5px;display:none;pointer-events:none;z-index:20
}
#map.visible{display:block}
#legend{
    position:absolute;right:18px;top:calc(114px + min(48vw,280px) + 7px);
    font-size:9px;color:#fff;opacity:.9;display:none;
    background:rgba(0,0,0,.7);padding:4px 6px;border-radius:4px;z-index:21
}
#legend.visible{display:block}

#status{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.stat{min-width:110px;padding:8px 12px;background:rgba(0,0,0,.65);border-radius:6px;text-align:center;font-size:11px}
.stat strong{display:block;font-size:17px;margin-top:2px}

#weapon{
    position:absolute;bottom:15px;left:50%;transform:translateX(-50%);
    min-width:135px;padding:7px 15px;background:rgba(0,0,0,.7);
    border-radius:6px;text-align:center;font-size:11px
}
#weapon strong{display:block;font-size:15px}
#ammo{font-size:13px}

#damageFlash{position:absolute;inset:0;background:rgba(255,0,0,.35);opacity:0;pointer-events:none}
#message{
    position:absolute;left:50%;top:20%;transform:translateX(-50%);
    padding:10px 18px;border-radius:8px;background:rgba(0,0,0,.75);
    color:#fff;font-size:14px;opacity:0;transition:opacity .15s;
    pointer-events:none;white-space:nowrap
}
#blueberryMarker{
    position:absolute;top:78px;left:14px;padding:8px 11px;
    border:1px solid #168cff;border-radius:7px;background:rgba(0,20,60,.8);
    color:#5db7ff;font-size:11px;font-weight:bold;display:none;z-index:25
}

#controls{position:absolute;inset:0;z-index:5;pointer-events:none}
#look-zone{position:absolute;left:35%;top:0;right:0;bottom:35%;pointer-events:auto}
#joystick{
    position:absolute;left:25px;bottom:65px;width:110px;height:110px;
    border:2px solid rgba(255,255,255,.25);border-radius:50%;
    background:rgba(0,0,0,.18);pointer-events:auto
}
#stick{
    position:absolute;left:50%;top:50%;width:50px;height:50px;
    transform:translate(-50%,-50%);border-radius:50%;
    border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)
}
.action{
    position:absolute;width:58px;height:58px;border-radius:50%;
    border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);
    color:#fff;font-size:10px;font-weight:bold;pointer-events:auto
}
#fire{right:25px;bottom:65px;width:82px;height:82px;font-size:13px}
#use{right:105px;bottom:92px}
#reload{right:105px;bottom:25px}
#nextWeapon{right:25px;bottom:160px;width:42px;height:42px;border-radius:8px;font-size:11px}

#modal{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.72);z-index:50
}
#modalBox{
    width:min(86vw,530px);padding:38px 25px 28px;background:#061208;
    border:2px solid #35ff52;border-radius:16px;text-align:center;color:#fff
}
#modalBox h1{margin:0 0 20px;color:#35ff52;font-size:42px;letter-spacing:4px}
#modalBox p{font-size:17px;line-height:1.5}
#continue{margin-top:18px;padding:15px 42px;border:0;border-radius:8px;background:#333;color:#fff;font-size:17px;font-weight:bold}

@media (orientation:portrait){
    #objective{display:none}
    #status .stat{min-width:80px;font-size:9px}
    #status .stat strong{font-size:14px}
    #weapon{font-size:9px;min-width:125px}
    #weapon strong{font-size:13px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="mission">MISSION 01</div>
    <div id="objective">FIND THE KEY AND REACH THE EXIT</div>

    <button id="pause" type="button">II</button>
    <button id="mapToggle" type="button">MAP</button>

    <div id="crosshair"></div>
    <canvas id="map"></canvas>
    <div id="legend">GREEN YOU &nbsp; RED ENEMY &nbsp; BLUE BOSS &nbsp; YELLOW KEY &nbsp; BLUE KEY &nbsp; ORANGE EXIT</div>

    <div id="status">
        <div class="stat">HEALTH<strong id="health">100</strong></div>
        <div class="stat">ARMOUR<strong id="armour">0</strong></div>
    </div>

    <div id="weapon">
        <strong id="weaponName">PISTOL</strong>
        <span id="ammo">12 / 48</span>
    </div>

    <div id="damageFlash"></div>
    <div id="message"></div>
    <div id="blueberryMarker">BLUEBERRY FOUND</div>
</div>

<div id="controls">
    <div id="look-zone"></div>
    <div id="joystick"><div id="stick"></div></div>

    <button class="action" id="fire" type="button">FIRE</button>
    <button class="action" id="use" type="button">USE</button>
    <button class="action" id="reload" type="button">RELOAD</button>
    <button class="action" id="nextWeapon" type="button">WEAPON</button>
</div>

<div id="modal">
    <div id="modalBox">
        <h1>MISSION COMPLETE</h1>
        <p>You found the key, opened the door and escaped the facility.</p>
        <button id="continue" type="button">CONTINUE</button>
    </div>
</div>

<script>
/* =========================================================
   MOBILE FPS
   Procedural maze / enemies / keys / doors / map
   ========================================================= */

const FOV=Math.PI/3;
const MAX_DEPTH=22;
const PLAYER_RADIUS=.20;
const ENEMY_RADIUS=.23;
const PLAYER_SPEED=2.25;
const ENEMY_SPEED=.82;
const PISTOL_DAMAGE=35;
const SHOTGUN_DAMAGE=80;
const PISTOL_DELAY=250;
const SHOTGUN_DELAY=700;
const ENEMY_DAMAGE=8;
const ENEMY_ATTACK_RANGE=1.15;
const ENEMY_ATTACK_DELAY=900;
const LOOK_SENSITIVITY=.0032;

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const mapCanvas=document.getElementById("map");
const mapCtx=mapCanvas.getContext("2d");
let W=0,H=0;

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    mapCanvas.width=280;
    mapCanvas.height=280;
}
window.addEventListener("resize",resize);
resize();

/* ---------------- AUDIO ---------------- */

let audioCtx=null;
let audioReady=false;

function initAudio(){
    if(!audioCtx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(AC)audioCtx=new AC();
    }
    if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
    audioReady=!!audioCtx;
}

function tone(freq,duration,type="square",volume=.07,endFreq=null){
    if(!audioReady||!audioCtx)return;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
    if(endFreq)osc.frequency.exponentialRampToValueAtTime(
        Math.max(20,endFreq),audioCtx.currentTime+duration
    );
    gain.gain.setValueAtTime(volume,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+duration+.02);
}

function gunSound(weapon){
    if(weapon==="pistol"){
        tone(180,.07,"square",.10,75);
        setTimeout(()=>tone(90,.05,"triangle",.05,45),25);
    }else{
        tone(95,.16,"sawtooth",.14,35);
        setTimeout(()=>tone(55,.12,"square",.07,30),55);
    }
}
function hitSound(){tone(180,.09,"square",.08,70)}
function damageSound(){tone(90,.18,"sawtooth",.10,35)}
function pickupSound(){tone(500,.08,"sine",.07,750)}
function keySound(){
    tone(650,.08,"square",.08,950);
    setTimeout(()=>tone(950,.10,"sine",.07,1200),80);
}
function doorSound(){
    tone(120,.22,"sawtooth",.08,260);
    setTimeout(()=>tone(320,.18,"square",.06,520),120);
}
function blueberrySound(){
    tone(400,.10,"sine",.07,650);
    setTimeout(()=>tone(650,.12,"sine",.07,900),100);
}
function dryFireSound(){tone(100,.06,"square",.04,70)}
function reloadSound(){
    tone(220,.06,"square",.05,320);
    setTimeout(()=>tone(320,.06,"square",.05,420),120);
}

["pointerdown","touchstart","keydown"].forEach(type=>{
    window.addEventListener(type,initAudio,{once:true,passive:true});
});

/* ---------------- MAP ---------------- */

const MAP_W=24,MAP_H=24;
const MAP=[];

for(let y=0;y<MAP_H;y++)MAP.push(new Array(MAP_W).fill("1"));

function setCell(x,y,v){
    if(x>=0&&y>=0&&x<MAP_W&&y<MAP_H)MAP[y][x]=v;
}

/* ---------------- PLAYER ---------------- */

const player={
    x:1.5,y:1.5,angle:0,
    health:100,armour:0,

    /* Magazine / reserve ammunition */
    pistolMag:12,
    pistolReserve:48,
    shotgunMag:6,
    shotgunReserve:18,

    weapon:"pistol",
    hasKey:false,
    hasBlueKey:false
};

/* ---------------- OBJECTS ---------------- */

const pickups=[];
const key={x:0,y:0,active:true};
const blueKey={x:0,y:0,active:true};
const door={x:0,y:0,open:false};
const blueDoor={x:0,y:0,open:false};

const enemies=[
    {type:"normal",x:0,y:0,health:70,maxHealth:70,active:true,lastAttack:0,path:[],pathTimer:0},
    {type:"normal",x:0,y:0,health:70,maxHealth:70,active:true,lastAttack:0,path:[],pathTimer:0},
    {type:"blueberry",x:0,y:0,health:110,maxHealth:110,active:true,lastAttack:0,path:[],pathTimer:0}
];

let blueberryFound=false;
let missionComplete=false;
let paused=false;
let lastShot=0;
let messageTimer=null;
let reloadTimer=null;

/* ---------------- INPUT ---------------- */

const keys={};

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key.toLowerCase()==="r")reload();
    if(e.key.toLowerCase()==="e")useDoor();
    if(e.key==="1")player.weapon="pistol";
    if(e.key==="2")player.weapon="shotgun";

    if(e.key===" "){
        e.preventDefault();
        togglePause();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

/* ---------------- JOYSTICK ---------------- */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joystickId=null,joyX=0,joyY=0;

function updateJoystick(x,y){
    const r=joystick.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx,dy=y-cy;
    const max=38,d=Math.hypot(dx,dy);

    if(d>max){
        dx=dx/d*max;
        dy=dy/d*max;
    }

    joyX=dx/max;
    joyY=dy/max;
    stick.style.transform=
        `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}

function resetJoystick(){
    joystickId=null;
    joyX=0;
    joyY=0;
    stick.style.transform="translate(-50%,-50%)";
}

joystick.addEventListener("pointerdown",e=>{
    e.preventDefault();
    initAudio();
    joystickId=e.pointerId;
    joystick.setPointerCapture(e.pointerId);
    updateJoystick(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{
    if(e.pointerId===joystickId)updateJoystick(e.clientX,e.clientY);
});

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

/* ---------------- LOOK ---------------- */

const lookZone=document.getElementById("look-zone");
let lookId=null,lastLookX=0;

lookZone.addEventListener("pointerdown",e=>{
    initAudio();
    lookId=e.pointerId;
    lastLookX=e.clientX;
    lookZone.setPointerCapture(e.pointerId);
});

lookZone.addEventListener("pointermove",e=>{
    if(e.pointerId!==lookId)return;
    const dx=e.clientX-lastLookX;
    lastLookX=e.clientX;
    player.angle+=dx*LOOK_SENSITIVITY;
});

lookZone.addEventListener("pointerup",()=>lookId=null);
lookZone.addEventListener("pointercancel",()=>lookId=null);

/* ---------------- BUTTONS ---------------- */

/* HUD is above the look-zone, so these buttons receive the tap. */

document.getElementById("fire").addEventListener("pointerdown",e=>{
    e.preventDefault();
    initAudio();
    fireWeapon();
});

document.getElementById("reload").addEventListener("pointerdown",e=>{
    e.preventDefault();
    initAudio();
    reload();
});

document.getElementById("use").addEventListener("pointerdown",e=>{
    e.preventDefault();
    initAudio();
    useDoor();
});

document.getElementById("nextWeapon").addEventListener("pointerdown",e=>{
    e.preventDefault();
    initAudio();
    cancelReload();
    player.weapon=player.weapon==="pistol"?"shotgun":"pistol";
    updateHUD();
});

document.getElementById("mapToggle").addEventListener("pointerdown",e=>{
    e.preventDefault();
    initAudio();

    const map=document.getElementById("map");
    const legend=document.getElementById("legend");
    const visible=map.classList.toggle("visible");
    legend.classList.toggle("visible",visible);

    if(visible)drawMap();
});

document.getElementById("pause").addEventListener("pointerdown",e=>{
    e.preventDefault();
    initAudio();
    togglePause();
});

document.getElementById("continue").addEventListener("pointerdown",()=>{
    initAudio();
    document.getElementById("modal").style.display="none";
    missionComplete=false;
    generateMission();
});

/* ---------------- PAUSE ---------------- */

function togglePause(){
    if(missionComplete)return;

    paused=!paused;
    document.getElementById("pause").textContent=paused?"PLAY":"II";
    showMessage(paused?"PAUSED":"RESUMED");
}

/* ---------------- COLLISION ---------------- */

function isWallCell(cx,cy){
    if(cx<0||cy<0||cx>=MAP_W||cy>=MAP_H)return true;
    return MAP[cy][cx]==="1";
}

function isSolidAt(x,y){
    const cx=Math.floor(x),cy=Math.floor(y);

    if(isWallCell(cx,cy))return true;

    if(!door.open&&Math.floor(door.x)===cx&&Math.floor(door.y)===cy)return true;
    if(!blueDoor.open&&Math.floor(blueDoor.x)===cx&&Math.floor(blueDoor.y)===cy)return true;

    return false;
}

function circleHitsWall(x,y,radius){
    const minX=Math.floor(x-radius),maxX=Math.floor(x+radius);
    const minY=Math.floor(y-radius),maxY=Math.floor(y+radius);

    for(let cy=minY;cy<=maxY;cy++){
        for(let cx=minX;cx<=maxX;cx++){
            if(!isSolidAt(cx+.5,cy+.5))continue;

            const nx=Math.max(cx,Math.min(x,cx+1));
            const ny=Math.max(cy,Math.min(y,cy+1));
            const dx=x-nx,dy=y-ny;

            if(dx*dx+dy*dy<radius*radius)return true;
        }
    }
    return false;
}

function moveWithCollision(obj,dx,dy,radius){
    const nx=obj.x+dx;
    if(!circleHitsWall(nx,obj.y,radius))obj.x=nx;

    const ny=obj.y+dy;
    if(!circleHitsWall(obj.x,ny,radius))obj.y=ny;
}

/* ---------------- LINE OF SIGHT ---------------- */

function hasLineOfSight(x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy);
    const steps=Math.ceil(d*12);

    for(let i=1;i<steps;i++){
        const t=i/steps;
        const x=x1+dx*t,y=y1+dy*t;
        if(isSolidAt(x,y))return false;
    }

    return true;
}

/* ---------------- PATHFINDING ---------------- */

function cellWalkable(x,y){
    if(x<0||y<0||x>=MAP_W||y>=MAP_H)return false;
    if(MAP[y][x]!=="0")return false;

    if(!door.open&&Math.floor(door.x)===x&&Math.floor(door.y)===y)return false;
    if(!blueDoor.open&&Math.floor(blueDoor.x)===x&&Math.floor(blueDoor.y)===y)return false;

    return true;
}

function findPath(sx0,sy0,ex0,ey0){
    const sx=Math.floor(sx0),sy=Math.floor(sy0);
    const ex=Math.floor(ex0),ey=Math.floor(ey0);

    if(!cellWalkable(ex,ey))return [];

    const q=[{x:sx,y:sy}];
    const seen=new Set([`${sx},${sy}`]);
    const parent=new Map();
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];

    while(q.length){
        const c=q.shift();

        if(c.x===ex&&c.y===ey){
            const path=[];
            let cur=c;

            while(cur.x!==sx||cur.y!==sy){
                path.unshift({x:cur.x+.5,y:cur.y+.5});
                cur=parent.get(`${cur.x},${cur.y}`);
            }

            return path;
        }

        for(const [dx,dy] of dirs){
            const nx=c.x+dx,ny=c.y+dy,k=`${nx},${ny}`;

            if(seen.has(k)||!cellWalkable(nx,ny))continue;

            seen.add(k);
            parent.set(k,c);
            q.push({x:nx,y:ny});
        }
    }

    return [];
}

/* ---------------- ENEMY AI ---------------- */

function updateEnemy(enemy,dt,now){
    if(!enemy.active)return;

    const dx=player.x-enemy.x;
    const dy=player.y-enemy.y;
    const d=Math.hypot(dx,dy);
    const visible=hasLineOfSight(enemy.x,enemy.y,player.x,player.y);

    if(d<=ENEMY_ATTACK_RANGE&&visible&&now-enemy.lastAttack>ENEMY_ATTACK_DELAY){
        enemy.lastAttack=now;
        damagePlayer(ENEMY_DAMAGE);
        return;
    }

    if(visible&&d>.85){
        moveWithCollision(
            enemy,
            dx/d*ENEMY_SPEED*dt,
            dy/d*ENEMY_SPEED*dt,
            ENEMY_RADIUS
        );
        return;
    }

    enemy.pathTimer-=dt;

    if(enemy.pathTimer<=0){
        enemy.pathTimer=.55;
        enemy.path=findPath(enemy.x,enemy.y,player.x,player.y);
    }

    if(enemy.path.length){
        const t=enemy.path[0];
        const tx=t.x-enemy.x,ty=t.y-enemy.y;
        const td=Math.hypot(tx,ty);

        if(td<.16)enemy.path.shift();
        else{
            moveWithCollision(
                enemy,
                tx/td*ENEMY_SPEED*dt,
                ty/td*ENEMY_SPEED*dt,
                ENEMY_RADIUS
            );
        }
    }
}

/* ---------------- PLAYER ---------------- */

function updatePlayer(dt){
    if(paused)return;

    let forward=0,strafe=0;

    if(keys["w"]||keys["arrowup"])forward++;
    if(keys["s"]||keys["arrowdown"])forward--;
    if(keys["a"]||keys["arrowleft"])strafe--;
    if(keys["d"]||keys["arrowright"])strafe++;

    forward+=-joyY;
    strafe+=joyX;

    const len=Math.hypot(forward,strafe);

    if(len>1){
        forward/=len;
        strafe/=len;
    }

    if(len>.05){
        const sin=Math.sin(player.angle);
        const cos=Math.cos(player.angle);

        moveWithCollision(
            player,
            (cos*forward-sin*strafe)*PLAYER_SPEED*dt,
            (sin*forward+cos*strafe)*PLAYER_SPEED*dt,
            PLAYER_RADIUS
        );
    }

    collectPickups();
}

/* ---------------- PICKUPS ---------------- */

function collectPickups(){
    for(const item of pickups){
        if(!item.active)continue;

        if(Math.hypot(item.x-player.x,item.y-player.y)<.55){
            item.active=false;
            pickupSound();

            if(item.type==="health"){
                player.health=Math.min(100,player.health+25);
                showMessage("+25 HEALTH");
            }

            if(item.type==="pistolAmmo"){
                player.pistolReserve+=24;
                showMessage("+24 PISTOL AMMO");
            }

            if(item.type==="shotgunAmmo"){
                player.shotgunReserve+=6;
                showMessage("+6 SHOTGUN AMMO");
            }
        }
    }

    if(key.active&&Math.hypot(key.x-player.x,key.y-player.y)<.55){
        key.active=false;
        player.hasKey=true;
        keySound();
        showMessage("KEY ACQUIRED");
    }

    if(blueKey.active&&Math.hypot(blueKey.x-player.x,blueKey.y-player.y)<.55){
        blueKey.active=false;
        player.hasBlueKey=true;
        keySound();
        showMessage("BLUE KEY ACQUIRED");
    }

    const blueberry=enemies.find(e=>e.type==="blueberry");

    if(
        blueberry &&
        !blueberryFound &&
        blueDoor.open &&
        Math.hypot(blueberry.x-player.x,blueberry.y-player.y)<1.8
    ){
        blueberryFound=true;
        blueberrySound();
        document.getElementById("blueberryMarker").style.display="block";
        showMessage("BLUEBERRY FOUND");
    }
}

/* ---------------- DOORS ---------------- */

function useDoor(){
    if(paused)return;

    const bd=Math.hypot(blueDoor.x-player.x,blueDoor.y-player.y);

    if(bd<=1.35){
        if(!player.hasBlueKey){
            showMessage("BLUE DOOR LOCKED");
            return;
        }

        if(!blueDoor.open){
            blueDoor.open=true;
            doorSound();
            showMessage("BLUE DOOR OPEN");
            return;
        }
    }

    const d=Math.hypot(door.x-player.x,door.y-player.y);

    if(d<=1.35){
        if(!player.hasKey){
            showMessage("THE EXIT IS LOCKED");
            return;
        }

        if(!door.open){
            door.open=true;
            doorSound();
            showMessage("EXIT OPEN");
            setTimeout(completeMission,700);
        }
    }
}

function completeMission(){
    if(missionComplete)return;
    missionComplete=true;
    cancelReload();
    document.getElementById("modal").style.display="flex";
}

/* ---------------- COMBAT ---------------- */

function currentMag(){
    return player.weapon==="pistol"?player.pistolMag:player.shotgunMag;
}

function currentReserve(){
    return player.weapon==="pistol"?player.pistolReserve:player.shotgunReserve;
}

function fireWeapon(){
    if(paused||missionComplete)return;

    if(reloadTimer){
        showMessage("RELOADING");
        return;
    }

    const now=performance.now();
    const weapon=player.weapon;

    if(weapon==="pistol"){
        if(now-lastShot<PISTOL_DELAY)return;

        if(player.pistolMag<=0){
            if(player.pistolReserve>0)showMessage("RELOAD");
            else{
                dryFireSound();
                showMessage("OUT OF AMMO");
            }
            return;
        }

        lastShot=now;
        player.pistolMag--;
        gunSound("pistol");
        shootSingle(PISTOL_DAMAGE);
    }else{
        if(now-lastShot<SHOTGUN_DELAY)return;

        if(player.shotgunMag<=0){
            if(player.shotgunReserve>0)showMessage("RELOAD");
            else{
                dryFireSound();
                showMessage("OUT OF AMMO");
            }
            return;
        }

        lastShot=now;
        player.shotgunMag--;
        gunSound("shotgun");
        shootShotgun();
    }

    updateHUD();
}

function targetForAngle(spread=.08){
    let best=null;
    let bestDistance=Infinity;

    for(const enemy of enemies){
        if(!enemy.active)continue;

        const dx=enemy.x-player.x;
        const dy=enemy.y-player.y;
        const d=Math.hypot(dx,dy);

        let a=Math.atan2(dy,dx)-player.angle+spread;
        a=Math.atan2(Math.sin(a),Math.cos(a));

        if(
            Math.abs(a)<.10 &&
            d<bestDistance &&
            hasLineOfSight(player.x,player.y,enemy.x,enemy.y)
        ){
            best=enemy;
            bestDistance=d;
        }
    }

    return best;
}

function shootSingle(damage){
    const best=targetForAngle(0);

    if(!best){
        hitSound();
        return;
    }

    best.health-=damage;
    hitSound();

    if(best.health<=0){
        best.active=false;
        showMessage(best.type==="blueberry"?"BLUEBERRY DOWN":"ENEMY DOWN");
    }
}

function shootShotgun(){
    let hitAny=false;

    for(let i=0;i<7;i++){
        const best=targetForAngle((Math.random()-.5)*.24);

        if(best){
            hitAny=true;
            best.health-=SHOTGUN_DAMAGE/7;

            if(best.health<=0){
                best.active=false;
                showMessage(best.type==="blueberry"?"BLUEBERRY DOWN":"ENEMY DOWN");
            }
        }
    }

    if(hitAny)hitSound();
}

/* ---------------- DAMAGE / RELOAD ---------------- */

function damagePlayer(amount){
    if(missionComplete)return;

    let damage=amount;

    if(player.armour>0){
        const absorbed=Math.min(player.armour,Math.ceil(amount*.5));
        player.armour-=absorbed;
        damage-=absorbed;
    }

    player.health=Math.max(0,player.health-damage);
    damageSound();

    const flash=document.getElementById("damageFlash");
    flash.style.opacity=".7";
    setTimeout(()=>flash.style.opacity="0",100);

    if(player.health<=0){
        cancelReload();
        showMessage("YOU DIED");
        setTimeout(resetGame,900);
    }
}

function cancelReload(){
    if(reloadTimer){
        clearTimeout(reloadTimer);
        reloadTimer=null;
    }
}

function reload(){
    if(paused||missionComplete)return;

    if(reloadTimer){
        showMessage("RELOADING");
        return;
    }

    if(player.weapon==="pistol"){
        if(player.pistolMag>=12){
            showMessage("MAGAZINE FULL");
            return;
        }

        if(player.pistolReserve<=0){
            showMessage("NO AMMO");
            return;
        }

        showMessage("RELOADING");
        reloadSound();

        reloadTimer=setTimeout(()=>{
            const needed=12-player.pistolMag;
            const loaded=Math.min(needed,player.pistolReserve);

            player.pistolMag+=loaded;
            player.pistolReserve-=loaded;
            reloadTimer=null;
            updateHUD();
        },500);
    }else{
        if(player.shotgunMag>=6){
            showMessage("MAGAZINE FULL");
            return;
        }

        if(player.shotgunReserve<=0){
            showMessage("NO AMMO");
            return;
        }

        showMessage("RELOADING");
        reloadSound();

        reloadTimer=setTimeout(()=>{
            const needed=6-player.shotgunMag;
            const loaded=Math.min(needed,player.shotgunReserve);

            player.shotgunMag+=loaded;
            player.shotgunReserve-=loaded;
            reloadTimer=null;
            updateHUD();
        },500);
    }
}

/* ---------------- PROCEDURAL MAZE ---------------- */

function buildProceduralMaze(){
    for(let y=0;y<MAP_H;y++){
        for(let x=0;x<MAP_W;x++)MAP[y][x]="1";
    }

    const start={x:1,y:1};
    setCell(1,1,"0");

    const stack=[start];
    const seen=new Set(["1,1"]);
    const dirs=[[2,0],[-2,0],[0,2],[0,-2]];

    while(stack.length){
        const c=stack[stack.length-1];
        const choices=[];

        for(const [dx,dy] of dirs){
            const nx=c.x+dx,ny=c.y+dy;

            if(
                nx>=1&&nx<=MAP_W-3&&
                ny>=1&&ny<=MAP_H-3&&
                !seen.has(`${nx},${ny}`)
            ){
                choices.push({
                    nx,ny,
                    wx:c.x+dx/2,
                    wy:c.y+dy/2
                });
            }
        }

        if(!choices.length){
            stack.pop();
            continue;
        }

        const c2=choices[Math.floor(Math.random()*choices.length)];

        setCell(c2.wx,c2.wy,"0");
        setCell(c2.nx,c2.ny,"0");

        seen.add(`${c2.nx},${c2.ny}`);
        stack.push({x:c2.nx,y:c2.ny});
    }

    /* Add loops so the maze is less corridor-like. */
    for(let i=0;i<Math.floor(MAP_W*MAP_H*.035);i++){
        const x=2+Math.floor(Math.random()*(MAP_W-4));
        const y=2+Math.floor(Math.random()*(MAP_H-4));

        if(MAP[y][x]==="1"){
            const horiz=MAP[y][x-1]==="0"&&MAP[y][x+1]==="0";
            const vert=MAP[y-1][x]==="0"&&MAP[y+1][x]==="0";

            if(horiz||vert)MAP[y][x]="0";
        }
    }
}

function getFloorCells(){
    const cells=[];

    for(let y=1;y<MAP_H-1;y++){
        for(let x=1;x<MAP_W-1;x++){
            if(MAP[y][x]==="0")cells.push({x,y});
        }
    }

    return cells;
}

function cellDegree(x,y){
    let n=0;

    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        if(MAP[y+dy]&&MAP[y+dy][x+dx]==="0")n++;
    }

    return n;
}

function mazeDistances(){
    const distances={"1,1":0};
    const parents={};
    const q=[{x:1,y:1}];

    while(q.length){
        const c=q.shift();

        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
            const nx=c.x+dx,ny=c.y+dy,k=`${nx},${ny}`;

            if(
                nx<0||ny<0||nx>=MAP_W||ny>=MAP_H||
                MAP[ny][nx]!=="0"||
                distances[k]!==undefined
            )continue;

            distances[k]=distances[`${c.x},${c.y}`]+1;
            parents[k]=c;
            q.push({x:nx,y:ny});
        }
    }

    return {distances,parents};
}

/* ---------------- MISSION GENERATION ---------------- */

function generateMission(){
    buildProceduralMaze();

    const {distances,parents}=mazeDistances();
    const floor=getFloorCells();

    const leaves=floor
        .filter(c=>cellDegree(c.x,c.y)===1&&distances[`${c.x},${c.y}`]>10)
        .sort((a,b)=>distances[`${b.x},${b.y}`]-distances[`${a.x},${a.y}`]);

    const exitCell=leaves[0]||{x:21,y:21};

    door.x=exitCell.x+.5;
    door.y=exitCell.y+.5;
    door.open=false;

    let blueberryCell=
        leaves.find(c=>Math.hypot(c.x-exitCell.x,c.y-exitCell.y)>6)||
        leaves[1]||
        {x:19,y:19};

    let blueParent=
        parents[`${blueberryCell.x},${blueberryCell.y}`]||
        {x:blueberryCell.x,y:Math.max(1,blueberryCell.y-1)};

    if(blueParent.x===1&&blueParent.y===1){
        blueParent={
            x:blueberryCell.x,
            y:Math.max(1,blueberryCell.y-1)
        };
    }

    blueDoor.x=blueParent.x+.5;
    blueDoor.y=blueParent.y+.5;
    blueDoor.open=false;

    const blueberry=enemies.find(e=>e.type==="blueberry");

    blueberry.x=blueberryCell.x+.5;
    blueberry.y=blueberryCell.y+.5;
    blueberry.active=true;
    blueberry.health=blueberry.maxHealth;
    blueberry.path=[];
    blueberry.pathTimer=0;
    blueberry.lastAttack=0;

    const reserved=[
        {x:1,y:1},
        exitCell,
        blueberryCell,
        blueParent
    ];

    const pool=floor.filter(c=>{
        const tooClose=reserved.some(
            r=>Math.hypot(r.x-c.x,r.y-c.y)<3
        );

        return !tooClose &&
            distances[`${c.x},${c.y}`]!==undefined &&
            distances[`${c.x},${c.y}`]>7;
    });

    const shuffled=[...pool].sort(()=>Math.random()-.5);

    const bk=shuffled[0]||{x:5,y:5};
    const ok=
        shuffled.find(c=>Math.hypot(c.x-bk.x,c.y-bk.y)>5)||
        shuffled[1]||
        {x:7,y:7};

    blueKey.x=bk.x+.5;
    blueKey.y=bk.y+.5;
    blueKey.active=true;

    key.x=ok.x+.5;
    key.y=ok.y+.5;
    key.active=true;

    const spawnPool=floor
        .filter(c=>{
            const forbidden=reserved.some(
                r=>r.x===c.x&&r.y===c.y
            );

            const d=Math.hypot(c.x-1.5,c.y-1.5);

            return !forbidden&&d>5;
        })
        .sort(()=>Math.random()-.5);

    let si=0;

    for(const e of enemies){
        if(e.type==="blueberry")continue;

        const c=spawnPool[si++]||{x:7+si,y:7};

        e.x=c.x+.5;
        e.y=c.y+.5;
        e.active=true;
        e.health=e.maxHealth;
        e.path=[];
        e.pathTimer=0;
        e.lastAttack=0;
    }

    pickups.length=0;

    const pickupPool=floor
        .filter(c=>{
            return !(
                c.x===Math.floor(door.x)&&
                c.y===Math.floor(door.y)
            )&&!(
                c.x===Math.floor(blueDoor.x)&&
                c.y===Math.floor(blueDoor.y)
            );
        })
        .sort(()=>Math.random()-.5);

    ["health","health","pistolAmmo","shotgunAmmo"].forEach((type,i)=>{
        const c=pickupPool[i+2];

        if(c){
            pickups.push({
                type,
                x:c.x+.5,
                y:c.y+.5,
                active:true
            });
        }
    });

    player.x=1.5;
    player.y=1.5;
    player.angle=0;
    player.hasKey=false;
    player.hasBlueKey=false;

    blueberryFound=false;
    missionComplete=false;

    document.getElementById("blueberryMarker").style.display="none";

    for(let y=0;y<MAP_H;y++)explored[y].fill(false);

    revealMap();
    updateHUD();
}

/* ---------------- RESET ---------------- */

function resetGame(){
    cancelReload();

    player.health=100;
    player.armour=0;
    player.pistolMag=12;
    player.pistolReserve=48;
    player.shotgunMag=6;
    player.shotgunReserve=18;
    player.weapon="pistol";

    generateMission();
}

/* ---------------- RENDER / RAYCAST ---------------- */

function castRay(angle){
    const sin=Math.sin(angle),cos=Math.cos(angle);
    let d=0;

    while(d<MAX_DEPTH){
        d+=.025;

        const x=player.x+cos*d;
        const y=player.y+sin*d;

        if(isSolidAt(x,y))return {distance:d,x,y};
    }

    return {
        distance:MAX_DEPTH,
        x:player.x+cos*MAX_DEPTH,
        y:player.y+sin*MAX_DEPTH
    };
}

function wallColour(hit,distance){
    const shade=Math.max(25,210-distance*10);
    const brick=(Math.floor(hit.x*8)%2)===(Math.floor(hit.y*8)%2);

    if(brick){
        return `rgb(${Math.floor(shade*.75)},${Math.floor(shade*.72)},${Math.floor(shade*.65)})`;
    }

    return `rgb(${Math.floor(shade*.62)},${Math.floor(shade*.60)},${Math.floor(shade*.55)})`;
}

function drawBackground(){
    const horizon=H/2;

    const c=ctx.createLinearGradient(0,0,0,horizon);
    c.addColorStop(0,"#050505");
    c.addColorStop(1,"#171717");
    ctx.fillStyle=c;
    ctx.fillRect(0,0,W,horizon);

    const f=ctx.createLinearGradient(0,horizon,0,H);
    f.addColorStop(0,"#24211d");
    f.addColorStop(1,"#090909");
    ctx.fillStyle=f;
    ctx.fillRect(0,horizon,W,H-horizon);
}

const depthBuffer=[];

function renderWalls(){
    depthBuffer.length=0;

    const rays=Math.floor(W/2);
    const cw=W/rays;

    for(let i=0;i<rays;i++){
        const cameraX=i/rays-.5;
        const rayAngle=
            player.angle+
            Math.atan(cameraX*Math.tan(FOV/2))*2;

        const hit=castRay(rayAngle);
        const corrected=
            hit.distance*Math.cos(rayAngle-player.angle);

        depthBuffer[i]=corrected;

        const wh=H/corrected;
        const top=H/2-wh/2;

        ctx.fillStyle=wallColour(hit,corrected);
        ctx.fillRect(i*cw,top,cw+1,wh);
    }
}

function projectObject(obj){
    const dx=obj.x-player.x;
    const dy=obj.y-player.y;
    const d=Math.hypot(dx,dy);

    let a=Math.atan2(dy,dx)-player.angle;
    a=Math.atan2(Math.sin(a),Math.cos(a));

    if(Math.abs(a)>FOV*.7)return null;

    const corrected=d*Math.cos(a);

    if(corrected<=.05)return null;

    const screenX=
        W/2+
        Math.tan(a)/Math.tan(FOV/2)*W/2;

    return {distance:d,corrected,screenX};
}

function visibleProjection(obj){
    const p=projectObject(obj);
    if(!p)return null;

    if(!hasLineOfSight(player.x,player.y,obj.x,obj.y))return null;

    const idx=Math.max(
        0,
        Math.min(
            depthBuffer.length-1,
            Math.floor(p.screenX/W*depthBuffer.length)
        )
    );

    if(depthBuffer[idx]&&depthBuffer[idx]<p.corrected)return null;

    return p;
}

/* ---------------- ENEMIES ---------------- */

function renderEnemies(){
    const list=[];

    for(const enemy of enemies){
        if(!enemy.active)continue;

        const p=visibleProjection(enemy);

        if(p)list.push({enemy,p});
    }

    list.sort((a,b)=>b.p.distance-a.p.distance);

    for(const {enemy,p} of list){
        const size=H/p.corrected*.72;
        const x=p.screenX-size/2;
        const y=H/2-size*.48;
        const cx=x+size/2;

        const head=size*.19;
        const body=size*.38;

        if(enemy.type==="blueberry"){
            ctx.fillStyle="#167cff";
            ctx.beginPath();
            ctx.arc(cx,y+size*.25,head,0,Math.PI*2);
            ctx.fill();

            ctx.fillStyle="#0757c7";
            ctx.fillRect(cx-body/2,y+size*.42,body,body*1.4);

            ctx.fillStyle="#fff";
            ctx.fillRect(cx-size*.10,y+size*.21,size*.05,size*.05);
            ctx.fillRect(cx+size*.05,y+size*.21,size*.05,size*.05);
        }else{
            ctx.fillStyle="#b31222";
            ctx.beginPath();
            ctx.arc(cx,y+size*.25,head,0,Math.PI*2);
            ctx.fill();

            ctx.fillStyle="#641019";
            ctx.fillRect(cx-body/2,y+size*.42,body,body*1.4);

            ctx.fillStyle="#ffcc00";
            ctx.fillRect(cx-size*.10,y+size*.22,size*.05,size*.05);
            ctx.fillRect(cx+size*.05,y+size*.22,size*.05,size*.05);
        }

        const bw=size*.55;

        ctx.fillStyle="#300";
        ctx.fillRect(cx-bw/2,y-8,bw,5);

        ctx.fillStyle=
            enemy.type==="blueberry"?"#168cff":"#ff3333";

        ctx.fillRect(
            cx-bw/2,
            y-8,
            bw*Math.max(0,enemy.health/enemy.maxHealth),
            5
        );
    }
}

/* ---------------- PICKUPS / DOORS ---------------- */

function renderPickups(){
    const objects=pickups.filter(i=>i.active);

    if(key.active)objects.push({
        type:"key",x:key.x,y:key.y
    });

    if(blueKey.active)objects.push({
        type:"blueKey",x:blueKey.x,y:blueKey.y
    });

    for(const obj of objects){
        const p=visibleProjection(obj);

        if(!p)continue;

        const size=H/p.corrected*.25;

        let colour="#fff";

        if(obj.type==="health")colour="#32ff54";
        if(obj.type==="pistolAmmo")colour="#ffd21a";
        if(obj.type==="shotgunAmmo")colour="#ff7b1a";
        if(obj.type==="key")colour="#ffd400";
        if(obj.type==="blueKey")colour="#168cff";

        ctx.fillStyle=colour;
        ctx.beginPath();
        ctx.arc(p.screenX,H/2,size,0,Math.PI*2);
        ctx.fill();

        if(obj.type==="blueKey"){
            ctx.strokeStyle="#8dccff";
            ctx.lineWidth=3;
            ctx.stroke();
        }
    }
}

function renderDoorObject(obj,open,fill,outline){
    if(open)return;

    const p=projectObject(obj);
    if(!p)return;

    const idx=Math.max(
        0,
        Math.min(
            depthBuffer.length-1,
            Math.floor(p.screenX/W*depthBuffer.length)
        )
    );

    if(depthBuffer[idx]&&depthBuffer[idx]<p.corrected-.1)return;

    const size=H/p.corrected;

    ctx.fillStyle=fill;
    ctx.fillRect(
        p.screenX-size*.4,
        H/2-size*.5,
        size*.8,
        size
    );

    ctx.strokeStyle=outline;
    ctx.lineWidth=4;
    ctx.strokeRect(
        p.screenX-size*.4,
        H/2-size*.5,
        size*.8,
        size
    );
}

function renderDoors(){
    renderDoorObject(
        door,door.open,
        "#b86a1c","#ffb43b"
    );

    renderDoorObject(
        blueDoor,blueDoor.open,
        "#0757c7","#38a1ff"
    );
}

/* ---------------- WEAPON ---------------- */

function renderWeapon(){
    const ww=Math.min(W*.25,210);
    const wh=ww*.6;
    const x=W/2-ww/2;
    const y=H-wh*.85;

    ctx.save();

    if(player.weapon==="pistol"){
        ctx.fillStyle="#252525";
        ctx.fillRect(x+ww*.25,y,ww*.5,wh*.35);

        ctx.fillStyle="#111";
        ctx.fillRect(x+ww*.43,y+wh*.25,ww*.18,wh*.55);
    }else{
        ctx.fillStyle="#333";
        ctx.fillRect(x+ww*.17,y,ww*.66,wh*.28);

        ctx.fillStyle="#111";
        ctx.fillRect(x+ww*.30,y+wh*.20,ww*.40,wh*.55);
    }

    ctx.restore();
}

/* ---------------- MAP ---------------- */

const explored=
    Array.from({length:MAP_H},()=>new Array(MAP_W).fill(false));

function revealMap(){
    const radius=3;
    const px=Math.floor(player.x);
    const py=Math.floor(player.y);

    for(let y=py-radius;y<=py+radius;y++){
        for(let x=px-radius;x<=px+radius;x++){
            if(
                x>=0&&y>=0&&
                x<MAP_W&&y<MAP_H&&
                Math.hypot(x-px,y-py)<=radius
            ){
                explored[y][x]=true;
            }
        }
    }
}

function drawMap(){
    const mw=mapCanvas.width;
    const mh=mapCanvas.height;
    const cw=mw/MAP_W;
    const ch=mh/MAP_H;

    mapCtx.clearRect(0,0,mw,mh);

    for(let y=0;y<MAP_H;y++){
        for(let x=0;x<MAP_W;x++){
            if(!explored[y][x]){
                mapCtx.fillStyle="#000";
                mapCtx.fillRect(x*cw,y*ch,cw+1,ch+1);
                continue;
            }

            mapCtx.fillStyle=
                MAP[y][x]==="1"?"#8b806a":"#eeeeee";

            mapCtx.fillRect(x*cw,y*ch,cw+1,ch+1);
        }
    }

    const drawDot=(x,y,color,size=.28)=>{
        const cx=x*cw;
        const cy=y*ch;

        mapCtx.fillStyle=color;
        mapCtx.beginPath();
        mapCtx.arc(
            cx,
            cy,
            Math.max(3,cw*size),
            0,
            Math.PI*2
        );
        mapCtx.fill();
    };

    if(explored[Math.floor(door.y)]?.[Math.floor(door.x)]){
        drawDot(
            door.x,
            door.y,
            door.open?"#777":"#ff8c00"
        );
    }

    if(explored[Math.floor(blueDoor.y)]?.[Math.floor(blueDoor.x)]){
        drawDot(
            blueDoor.x,
            blueDoor.y,
            blueDoor.open?"#777":"#168cff"
        );
    }

    if(key.active&&explored[Math.floor(key.y)]?.[Math.floor(key.x)]){
        drawDot(key.x,key.y,"#ffd400");
    }

    if(
        blueKey.active&&
        explored[Math.floor(blueKey.y)]?.[Math.floor(blueKey.x)]
    ){
        drawDot(blueKey.x,blueKey.y,"#168cff");
    }

    for(const enemy of enemies){
        if(!enemy.active)continue;

        const ex=Math.floor(enemy.x);
        const ey=Math.floor(enemy.y);

        if(explored[ey]?.[ex]){
            drawDot(
                enemy.x,
                enemy.y,
                enemy.type==="blueberry"?"#168cff":"#ff4b4b"
            );
        }
    }

    drawDot(player.x,player.y,"#28ff58",.30);

    mapCtx.strokeStyle="#28ff58";
    mapCtx.lineWidth=2;
    mapCtx.beginPath();

    mapCtx.moveTo(
        player.x*cw,
        player.y*ch
    );

    mapCtx.lineTo(
        (player.x+Math.cos(player.angle)*.7)*cw,
        (player.y+Math.sin(player.angle)*.7)*ch
    );

    mapCtx.stroke();
}

/* ---------------- HUD / MESSAGE ---------------- */

function updateHUD(){
    document.getElementById("health").textContent=
        Math.ceil(player.health);

    document.getElementById("armour").textContent=
        Math.ceil(player.armour);

    document.getElementById("weaponName").textContent=
        player.weapon==="pistol"?"PISTOL":"SHOTGUN";

    let ammoText;

    if(player.weapon==="pistol"){
        ammoText=
            `${player.pistolMag} / ${player.pistolReserve}`;
    }else{
        ammoText=
            `${player.shotgunMag} / ${player.shotgunReserve}`;
    }

    document.getElementById("ammo").textContent=ammoText;

    let text=
        player.hasKey?
        "REACH THE EXIT":
        "FIND THE KEY AND REACH THE EXIT";

    if(player.hasBlueKey)text+=" â¢ BLUE KEY";
    if(blueberryFound)text+=" â¢ BLUEBERRY FOUND";

    document.getElementById("objective").textContent=text;
}

function showMessage(text){
    const el=document.getElementById("message");

    el.textContent=text;
    el.style.opacity="1";

    clearTimeout(messageTimer);

    messageTimer=setTimeout(()=>{
        el.style.opacity="0";
    },900);
}

/* ---------------- START ---------------- */

generateMission();

/* ---------------- LOOP ---------------- */

let lastTime=performance.now();

function gameLoop(now){
    const dt=Math.min(.05,(now-lastTime)/1000);
    lastTime=now;

    if(!paused&&!missionComplete){
        updatePlayer(dt);

        for(const enemy of enemies){
            updateEnemy(enemy,dt,now);
        }

        revealMap();
    }

    drawBackground();
    renderWalls();
    renderDoors();
    renderPickups();
    renderEnemies();
    renderWeapon();
    updateHUD();
    drawMap();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
